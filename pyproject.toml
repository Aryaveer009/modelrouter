[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modelrouter"
version = "0.1.0"
description = "OpenAI-compatible proxy that cuts LLM costs by routing easy queries to a cheap model and hard ones to a strong model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aryaveer Mankotia" }]
keywords = ["llm", "cost-optimization", "model-routing", "fastapi", "mlops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.3"]
bench = ["matplotlib>=3.8"]
dashboard = ["streamlit>=1.37", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/Aryaveer009/modelrouter"
Repository = "https://github.com/Aryaveer009/modelrouter"
Author = "https://github.com/Aryaveer009"

[project.scripts]
modelrouter = "modelrouter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/modelrouter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long strings in tables/messages are fine; ruff format wraps code

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
